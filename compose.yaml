services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: deepcancer
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - research-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d deepcancer"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://research:${POSTGRES_PASSWORD}@database:5432/deepcancer
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./ml/weights:/app/ml/weights:ro
      - ./outputs/evaluation:/app/outputs/evaluation:ro
    depends_on:
      database:
        condition: service_healthy
volumes:
  research-db:
